            position: fixed;

            left: 0;

            height: 100%;

            z-index: 0;

            background-repeat: repeat;
            opacity: 0.5;
            animation: starMove 60s linear infinite;
        }
        @keyframes starMove {
            0% { background-position: 0% 0%, 0% 0%, 0% 0%;}
            100% { background-position: 350px 300px, 250px 350px, 200px 250px;}
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            backdrop-filter: blur(12px);
            z-index: 1000;

            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            transition: opacity 0.5s ease;
            pointer-events: all;
        }
        .loading-overlay.hide {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 64px;
            height: 64px;
            border: 4px solid rgba(255, 255, 255, 0.2);

</head>

                { name: "Wuhu Fantawild", type: "intangible", lng: 118.376, lat: 31.333, cultural: 45, scenery: 75, food: 68, intangible: 95, leisure: 92, cold: "Intangible heritage theme park blending mythology and technology. Heritage festival+fireworks show, modern cultural tourism icon." },
                { name: "Anhui Intangible Heritage Park", type: "intangible", lng: 117.297, lat: 31.866, cultural: 78, scenery: 65, food: 60, intangible: 98, leisure: 70, cold: "Living heritage of Hui Opera, Lu Opera, Nuo Opera. Master workshops for hands-on experience." },
                { name: "Hefei Lei Street", type: "food", lng: 117.297, lat: 31.834, cultural: 65, scenery: 70, food: 98, intangible: 60, leisure: 82, cold: "Hefei's late-night food landmark, 'Zha Leizi' folk drinking culture, gathering Hui cuisine and local snacks." },
                { name: "Tunxi Ancient Street", type: "food", lng: 118.315, lat: 29.711, cultural: 88, scenery: 85, food: 96, intangible: 85, leisure: 85, cold: "'River of Qingming Scroll' in motion. Birthplace of Huizhou biscuits, stinky tofu, and stinky mandarin fish." },
                { name: "Jiuhua Mountain", type: "natural", lng: 117.812, lat: 30.479, cultural: 94, scenery: 91, food: 48, intangible: 79, leisure: 68, cold: "Sacred site of Kṣitigarbha Bodhisattva. Flesh Hall Buddhist relics, sea of clouds and Buddha's halo interweave." },
                { name: "Langya Mountain", type: "natural", lng: 118.314, lat: 32.303, cultural: 84, scenery: 85, food: 45, intangible: 55, leisure: 86, cold: "Birthplace of Ouyang Xiu's 'The Story of the Old Tippler'. The joy of mountains and waters resides in heart and wine." },
                { name: "Xuan Paper Cultural Park", type: "intangible", lng: 118.413, lat: 30.693, cultural: 88, scenery: 74, food: 38, intangible: 100, leisure: 60, cold: "Home of Chinese Xuan paper. Wingceltis bark + sand field rice straw. Millennium paper intangible heritage." },
                { name: "Qiyun Mountain", type: "natural", lng: 118.023, lat: 29.809, cultural: 85, scenery: 90, food: 42, intangible: 68, leisure: 78, cold: "One of four great Taoist mountains. Cliff carvings and Danxia landform. Emperor Qianlong praised 'Unrivaled scenic wonder'." },
                { name: "Jixi Longchuan", type: "historic", lng: 118.575, lat: 30.067, cultural: 94, scenery: 86, food: 62, intangible: 84, leisure: 76, cold: "Longchuan Hu's Ancestral Hall praised as 'Best in Jiangnan'. Exquisite wood carvings, Yishi Minister Archway." },
                { name: "Ma'anshan Caishiji", type: "natural", lng: 118.503, lat: 31.694, cultural: 88, scenery: 87, food: 55, intangible: 52, leisure: 80, cold: "Top of Three Rocks of Yangtze River. Legend of Li Bai capturing the moon. Sanyuan Cave cliff facing river." },
                { name: "Bozhou Huaxilou", type: "historic", lng: 115.779, lat: 33.873, cultural: 92, scenery: 72, food: 78, intangible: 86, leisure: 70, cold: "Exquisite brick and wood carvings. Ancient theater performing for millennia, essence of Bozhou ancient charm." },
                { name: "Balihé Scenic Area", type: "natural", lng: 116.267, lat: 32.649, cultural: 60, scenery: 88, food: 50, intangible: 45, leisure: 96, cold: "Northern Anhui water town, 'World's First Farmers' Park'. Sparkling lake, birds and flowers, leisure resort." },
                { name: "Chengkan Ancient Town", type: "historic", lng: 118.275, lat: 29.912, cultural: 95, scenery: 87, food: 64, intangible: 79, leisure: 82, cold: "Visit Chengkan, no misfortune ever. Bagua village layout. Luodongshu Hall a Ming architectural gem." }
            ];

            // ==================== 景点类型映射 ====================
            const typeMap = {
                natural: { name: "自然风光", nameEn: "Nature", symbol: "circle", color: "#FFD966", symbolSize: 12 },
                historic: { name: "人文古迹", nameEn: "Heritage", symbol: "diamond", color: "#C9B6E0", symbolSize: 12 },
                intangible: { name: "非遗体验", nameEn: "ICH", symbol: "roundRect", color: "#FFA07A", symbolSize: 12 },
                food: { name: "美食打卡", nameEn: "Food", symbol: "triangle", color: "#76E4B0", symbolSize: 12 }
            };

            // ==================== 国际化文本 ====================
            const i18n = {
                zh: {
                    loading: "✨ 星图绘制中 · 徽韵渐起 ✨",
                    homeBtn: "🏠 首页",
                    mainTitle: "徽韵星图 · 文旅雷达",
                    subTitle: "调整偏好 · 星辰共鸣 · 灵感流光",
                    legendNatural: "自然风光", legendHistoric: "人文古迹", legendIntangible: "非遗体验", legendFood: "美食打卡", legendHighMatch: "高匹配",
                    filterAll: "全部星点", filterNatural: "自然风光", filterHistoric: "人文古迹", filterIntangible: "非遗体验", filterFood: "美食打卡",
                    cult: "文化厚重感", scenery: "风景出片率", food: "美食浓度", intangible: "非遗互动度", leisure: "休闲指数",
                    defaultInfo: "✨ 灵感星语：点击任意景点，获取专属冷知识<br>调节雷达滑块，高匹配景点涟漪闪烁，并生成流光旅程~<br>左下角可分类筛选景区。",
                    radarSeriesName: "当前偏好"
                },
                en: {
                    loading: "✨ Drawing Starmap · Huizhou Charm ✨",
                    homeBtn: "🏠 Home",
                    mainTitle: "Hui Starmap · Cultural Radar",
                    subTitle: "Adjust Preferences · Star Resonance · Inspiration Flow",
                    legendNatural: "Nature", legendHistoric: "Heritage", legendIntangible: "ICH", legendFood: "Food", legendHighMatch: "High Match",
                    filterAll: "All Spots", filterNatural: "Nature", filterHistoric: "Heritage", filterIntangible: "ICH", filterFood: "Food",
                    cult: "Cultural Depth", scenery: "Scenic View", food: "Food Scene", intangible: "ICH Experience", leisure: "Relaxation",
                    defaultInfo: "✨ Inspiration: Click any spot for exclusive trivia.<br>Adjust sliders to see high-match spots ripple and create light trails.<br>Filter attractions by category at bottom left.",
                    radarSeriesName: "Current Preference"
                }
            };

            // ==================== 地市中英文映射（用于地图行政区名称） ====================
            const cityNameMap = {
                "合肥市": "Hefei",
                "芜湖市": "Wuhu",
                "蚌埠市": "Bengbu",
                "淮南市": "Huainan",
                "马鞍山市": "Ma'anshan",
                "淮北市": "Huaibei",
                "铜陵市": "Tongling",
                "安庆市": "Anqing",
                "黄山市": "Huangshan",
                "滁州市": "Chuzhou",
                "阜阳市": "Fuyang",
                "宿州市": "Suzhou",
                "六安市": "Lu'an",
                "亳州市": "Bozhou",
                "池州市": "Chizhou",
                "宣城市": "Xuancheng"
            };

            // ==================== 全局变量 ====================
            let currentLang = 'zh';
            let myMapChart = null, myRadarChart = null;
            let currentPreference = { cultural: 68, scenery: 82, food: 55, intangible: 70, leisure: 80 };
            let currentTypeFilter = 'all';
            let currentSpotsData = spotsDataZh;

            function getSpotByName(name) {
                return currentSpotsData.find(s => s.name === name);
            }

            function computeMatchScore(spot, pref) {
                const diff = Math.sqrt(
                    Math.pow(spot.cultural - pref.cultural, 2) +
                    Math.pow(spot.scenery - pref.scenery, 2) +
                    Math.pow(spot.food - pref.food, 2) +
                    Math.pow(spot.intangible - pref.intangible, 2) +
                    Math.pow(spot.leisure - pref.leisure, 2)
                );
                const maxDiff = Math.sqrt(5 * 100 * 100);
                return Math.min(100, Math.max(0, 100 - (diff / maxDiff) * 100));
            }

            function updateMapByPreference() {
                if (!myMapChart) return;
                let filteredSpots = currentTypeFilter === 'all' ? currentSpotsData : currentSpotsData.filter(spot => spot.type === currentTypeFilter);
                if (filteredSpots.length === 0) {
                    myMapChart.setOption({ series: [{ type: 'scatter', data: [] }, { type: 'effectScatter', data: [] }, { type: 'lines', data: [] }] }, false);
                    return;
                }
                const spotsWithScore = filteredSpots.map(spot => ({ ...spot, matchScore: computeMatchScore(spot, currentPreference) }));
                const highMatches = [...spotsWithScore].sort((a,b) => b.matchScore - a.matchScore).slice(0, 4);
                const highMatchNames = new Set(highMatches.map(s => s.name));
                const normalSpots = spotsWithScore.filter(s => !highMatchNames.has(s.name));
                const normalSeriesData = normalSpots.map(spot => ({
                    name: spot.name, value: [spot.lng, spot.lat, spot.matchScore],
                    itemStyle: { color: typeMap[spot.type].color, borderColor: '#fff', borderWidth: 0.8 },
                    symbol: typeMap[spot.type].symbol, symbolSize: 10,
                }));
                const effectData = highMatches.map(spot => ({
                    name: spot.name, value: [spot.lng, spot.lat, spot.matchScore],
                    itemStyle: { color: '#FCE570', shadowBlur: 12, borderColor: '#FFE484', borderWidth: 2 },
                    symbol: typeMap[spot.type].symbol, symbolSize: 18,
                    rippleEffect: { brushType: 'stroke', scale: 3.5, period: 4 }
                }));
                let linesData = [];
                if (highMatches.length >= 2) {
                    const linePoints = highMatches.map(spot => [spot.lng, spot.lat]);
                    for (let i = 0; i < linePoints.length - 1; i++) {
                        linesData.push({ coords: [linePoints[i], linePoints[i+1]], lineStyle: { color: '#F9D976', width: 2.5, curveness: 0.2 } });
                    }
                    if (linePoints.length > 2) {
                        linesData.push({ coords: [linePoints[linePoints.length-1], linePoints[0]], lineStyle: { color: '#F5B041', width: 1.8, curveness: 0.3, type: 'dashed', opacity: 0.7 } });
                    }
                }
                const option = {
                    series: [
                        { name: 'Huizhou Stars', type: 'scatter', coordinateSystem: 'geo', data: normalSeriesData, symbolSize: 10,
                          tooltip: { formatter: (params) => { let s = getSpotByName(params.name); return `<strong>${params.name}</strong><br/>Match: ${s?.matchScore?.toFixed(0) || '--'}%<br/>Click for trivia`; } } },
                        { name: 'Inspiration Highlight', type: 'effectScatter', coordinateSystem: 'geo', data: effectData, symbolSize: 18, rippleEffect: { period: 3, scale: 3.5 },
                          label: { show: true, formatter: '{b}', position: 'top', fontWeight: 'bold', color: '#FFEDA8' },
                          tooltip: { formatter: (params) => `${params.name} High Match Recommendation, click for trivia` } }
                    ],
                    backgroundColor: 'transparent',
                    tooltip: { trigger: 'item', backgroundColor: 'rgba(10,20,40,0.9)', borderColor: '#ffc96e', textStyle: { color: '#f8f3e0' } }
                };
                if (linesData.length) option.series.push({ type: 'lines', coordinateSystem: 'geo', data: linesData, lineStyle: { color: '#FDCF7C', width: 2.2, curveness: 0.2, opacity: 0.85 }, effect: { show: true, period: 4, trailLength: 0.4, symbol: 'arrow', symbolSize: 8, color: '#FFE5A3' }, zlevel: 1 });
                myMapChart.setOption(option, false);
            }

            function updateRadarChart() {
                if (!myRadarChart) return;
                const texts = i18n[currentLang];
                myRadarChart.setOption({
                    radar: { indicator: [
                        { name: texts.cult, max: 100 },{ name: texts.scenery, max: 100 },
                        { name: texts.food, max: 100 },{ name: texts.intangible, max: 100 },{ name: texts.leisure, max: 100 }
                    ], shape: 'circle', center: ['50%', '50%'], radius: '65%',
                    name: { textStyle: { color: '#EEDDAA' } }, splitArea: { areaStyle: { color: ['rgba(255,205,110,0.1)', 'rgba(200,170,90,0.05)'] } } },
                    series: [{ type: 'radar', data: [{ value: [currentPreference.cultural, currentPreference.scenery, currentPreference.food, currentPreference.intangible, currentPreference.leisure], name: texts.radarSeriesName }], symbol: 'none', lineStyle: { width: 2, color: '#F9D371' }, areaStyle: { color: 'rgba(249, 211, 113, 0.25)' } }]
                }, true);
            }

            function refreshAll() { updateRadarChart(); updateMapByPreference(); }

            function getGeoConfig() {
                return {
                    map: '安徽',
                    roam: true,
                    zoom: 1.08,
                    center: [117.2, 31.3],
                    itemStyle: { borderColor: '#3B5575', borderWidth: 1.2, areaColor: '#101c34' },
                    emphasis: {
                        itemStyle: { areaColor: '#1f3060' },
                        label: { show: true, color: '#ffffff', fontWeight: 'bold' }
                    },
                    label: {
                        show: true,
                        formatter: function(params) {
                            if (currentLang === 'zh') return params.name;
                            return cityNameMap[params.name] || params.name;
                        },
                        color: '#c0d0e8',
                        fontSize: 10
                    },
                    tooltip: {
                        show: true,
                        formatter: function(params) {
                            const zhName = params.name;
                            if (currentLang === 'zh') return zhName;
                            return cityNameMap[zhName] || zhName;
                        }
                    }
                };
            }

            function refreshMapGeoConfig() {
                if (!myMapChart) return;
                let currentOption;
                try {
                    currentOption = myMapChart.getOption();
                } catch (e) {
                    currentOption = null;
                }
                const series = (currentOption && Array.isArray(currentOption.series)) ? currentOption.series : [];
                myMapChart.setOption({
                    geo: getGeoConfig(),
                    series: series
                }, false);
            }

            function bindMapClick() {
                if (!myMapChart) return;
                myMapChart.off('click');
                myMapChart.on('click', (params) => {
                    if (params.componentType === 'series' && (params.seriesType === 'scatter' || params.seriesType === 'effectScatter')) {
                        const spot = getSpotByName(params.name);
                        if (spot) {
                            currentPreference = {
                                cultural: spot.cultural, scenery: spot.scenery, food: spot.food,
                                intangible: spot.intangible, leisure: spot.leisure
                            };
                            document.getElementById('cult').value = spot.cultural; document.getElementById('cultVal').innerText = spot.cultural;
                            document.getElementById('scenery').value = spot.scenery; document.getElementById('sceneryVal').innerText = spot.scenery;
                            document.getElementById('food').value = spot.food; document.getElementById('foodVal').innerText = spot.food;
                            document.getElementById('intangible').value = spot.intangible; document.getElementById('intangibleVal').innerText = spot.intangible;
                            document.getElementById('leisure').value = spot.leisure; document.getElementById('leisureVal').innerText = spot.leisure;
                            refreshAll();
                            const coldDiv = document.getElementById('coldInfo');
                            coldDiv.innerHTML = `<p><strong>「${spot.name}」· ${currentLang === 'zh' ? '徽韵冷知识' : 'Trivia'}</strong><br>${spot.cold}<br>${currentLang === 'zh' ? '雷达已同步，专属灵感路线已更新~' : 'Radar synced, inspiration route updated~'}</p>`;
                        }
                    }
                });
            }

            function bindSliders() {
                const ids = ['cult', 'scenery', 'food', 'intangible', 'leisure'];
                const mapKey = { cult: 'cultural', scenery: 'scenery', food: 'food', intangible: 'intangible', leisure: 'leisure' };
                ids.forEach(id => {
                    const slider = document.getElementById(id);
                    const valSpan = document.getElementById(id + 'Val');
                    slider.addEventListener('input', (e) => {
                        const newVal = parseInt(e.target.value);
                        valSpan.innerText = newVal;
                        currentPreference[mapKey[id]] = newVal;
                        refreshAll();
                        document.getElementById('coldInfo').innerHTML = `<p>${currentLang === 'zh' ? '✨ 灵感星语 : 雷达偏好已变，星光连线重新织就。<br>匹配度高的景点发出涟漪，分类筛选依旧生效~' : '✨ Sliders adjusted, starlight connections renewed.<br>High-match spots ripple, filters still active~'}</p>`;
                    });
                });
            }

            function bindFilterButtons() {
                const btns = document.querySelectorAll('.tag-btn');
                btns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const type = btn.getAttribute('data-type');
                        if (!type) return;
                        btns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentTypeFilter = type;
                        refreshAll();
                        const tip = currentLang === 'zh' ? `🔍 当前筛选: ${btn.innerText}<br>已展示省内相关景点，可继续调节雷达获得专属匹配路线。` : `🔍 Filter: ${btn.innerText}<br>Showing relevant spots, adjust radar for custom matching.`;
                        document.getElementById('coldInfo').innerHTML = `<p>${tip}</p>`;
                    });
                });
            }

            function applyLanguage() {
                const t = i18n[currentLang];
                const loadingSpan = document.getElementById('loadingText');
                if (loadingSpan) loadingSpan.innerText = t.loading;
                document.getElementById('homeBtn').innerHTML = t.homeBtn;
                document.getElementById('mainTitle').innerText = t.mainTitle;
                document.getElementById('subTitle').innerText = t.subTitle;
                document.getElementById('legendNaturalText').innerText = t.legendNatural;
                document.getElementById('legendHistoricText').innerText = t.legendHistoric;
                document.getElementById('legendIntangibleText').innerText = t.legendIntangible;
                document.getElementById('legendFoodText').innerText = t.legendFood;
                document.getElementById('legendHighMatchText').innerText = t.legendHighMatch;
                document.getElementById('filterAll').innerText = t.filterAll;
                document.getElementById('filterNatural').innerText = t.filterNatural;
                document.getElementById('filterHistoric').innerText = t.filterHistoric;
                document.getElementById('filterIntangible').innerText = t.filterIntangible;
                document.getElementById('filterFood').innerText = t.filterFood;
                document.getElementById('cultLabel').innerText = t.cult;
                document.getElementById('sceneryLabel').innerText = t.scenery;
                document.getElementById('foodLabel').innerText = t.food;
                document.getElementById('intangibleLabel').innerText = t.intangible;
                document.getElementById('leisureLabel').innerText = t.leisure;
                document.getElementById('coldInfo').innerHTML = `<p>${t.defaultInfo}</p>`;

                updateRadarChart();
                updateMapByPreference();
                refreshMapGeoConfig();
            }

            function switchLanguage() {
                currentLang = currentLang === 'zh' ? 'en' : 'zh';
                localStorage.setItem('appLang', currentLang);
                currentSpotsData = currentLang === 'zh' ? spotsDataZh : spotsDataEn;
                applyLanguage();
                refreshAll();
            }

            async function initMap() {
                try {
                    const response = await fetch('anhui.json');
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const geoJson = await response.json();
                    if (!geoJson || !geoJson.features) throw new Error('Invalid GeoJSON');
                    echarts.registerMap('安徽', geoJson);
                    console.log('✅ 安徽地图加载成功');
                } catch (err) {
                    console.warn('❌ anhui.json 加载失败，使用空白地图', err);
                    const emptyGeo = { type: "FeatureCollection", features: [] };
                    echarts.registerMap('安徽', emptyGeo);
                    document.getElementById('coldInfo').innerHTML = `<p>⚠️ 地图数据加载失败，但景点星图仍可正常使用。请检查网络或刷新重试。<br>✨ 调节雷达查看高匹配景点。</p>`;
                } finally {
                    myMapChart = echarts.init(document.getElementById('mapChart'));
                    refreshMapGeoConfig();
                    refreshAll();
                    bindMapClick();
                    window.addEventListener('resize', () => { myMapChart.resize(); myRadarChart?.resize(); });
                    document.getElementById('loadingOverlay').classList.add('hide');
                    setTimeout(() => { document.getElementById('loadingOverlay').style.display = 'none'; }, 500);
                }
            }

            function initRadar() {
                const radarDom = document.getElementById('radarChart');
                if (radarDom && typeof echarts !== 'undefined') {
                    myRadarChart = echarts.init(radarDom);
                    updateRadarChart();
                }
            }

            function bindHomeButton() {
                document.getElementById('homeBtn').addEventListener('click', () => { window.location.href = 'index.html'; });
            }

            function initLang() {
                const savedLang = localStorage.getItem('appLang');
                if (savedLang === 'en') {
                    currentLang = 'en';
                    currentSpotsData = spotsDataEn;
                } else {
                    currentLang = 'zh';
                    currentSpotsData = spotsDataZh;
                }
                applyLanguage();
                document.getElementById('langSwitchBtn').addEventListener('click', switchLanguage);
            }

            function startApp() {
                initLang();
                initRadar();
                bindSliders();
                bindFilterButtons();
                bindHomeButton();
                initMap();
            }

            if (typeof echarts !== 'undefined') {
                startApp();
            } else {
                const wait = setInterval(() => {
                    if (typeof echarts !== 'undefined') {
                        clearInterval(wait);
                        startApp();
                    }
                }, 200);
            }
        })();
    </script>
    <script src="static/js/navbar.js"></script>
</body>
</html>
