<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>非遗星图・多省文旅雷达 | 沉浸式景点探索</title>
    <link rel="icon" href="static/img/logo/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="static/img/logo/logo.png">
    <link rel="stylesheet" href="static/css/navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="static/js/spots-data.js"></script>
    <script src="static/js/city-name-map.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #020617 0%, #0a0f2a 100%);
            font-family: 'Segoe UI', 'Poppins', 'Noto Sans SC', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            color: #fff;
        }
        .star-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: radial-gradient(2px 2px at 15% 30%, #fff, rgba(0,0,0,0)),
                              radial-gradient(3px 3px at 70% 80%, #f5e6b2, rgba(0,0,0,0)),
                              radial-gradient(1px 1px at 90% 20%, #b0e0ff, rgba(0,0,0,0));
            background-size: 300px 300px, 350px 350px, 200px 200px;
            background-repeat: repeat;
            opacity: 0.5;
            animation: starMove 60s linear infinite;
        }
        @keyframes starMove {
            0% { background-position: 0% 0%, 0% 0%, 0% 0%;}
            100% { background-position: 350px 300px, 250px 350px, 200px 250px;}
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            transition: opacity 0.5s ease;
            pointer-events: all;
        }
        .loading-overlay.hide {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 64px;
            height: 64px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #F9D371;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 1rem;
            letter-spacing: 2px;
            color: #e5e9f0;
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        .dashboard {
            position: relative;
            z-index: 2;
            display: flex;
            height: 100vh;
            width: 100%;
            padding: 80px 20px 20px 20px;
            gap: 20px;
            backdrop-filter: blur(1px);
        }
        .map-container {
            flex: 3;
            position: relative;
            background: rgba(5, 12, 35, 0.6);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 24px -8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
            border: 1px solid rgba(120, 160, 255, 0.25);
            overflow: hidden;
        }
        #mapChart {
            width: 100%;
            height: 100%;
        }
        /* 地图内层加载动画（覆盖在 mapChart 之上） */
        .map-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(5, 12, 35, 0.55);
            backdrop-filter: blur(2px);
            z-index: 5;
            opacity: 1;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }
        .map-loading.hide {
            opacity: 0;
            pointer-events: none;
        }
        .map-loading .mini-spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(255, 255, 255, 0.18);
            border-top: 3px solid #F9D371;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        .map-loading .mini-loading-text {
            color: #EEDDAA;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            text-shadow: 0 0 8px rgba(249, 211, 113, 0.5);
        }
        /* 地图内层空状态（数据缺失兜底） */
        .map-empty {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(5, 12, 35, 0.65);
            backdrop-filter: blur(4px);
            z-index: 6;
            color: #EEDDAA;
            text-align: center;
            padding: 24px;
        }
        .map-empty.hide {
            display: none;
        }
        .map-empty .empty-icon {
            font-size: 3rem;
            opacity: 0.7;
        }
        .map-empty .empty-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #F9D371;
        }
        .map-empty .empty-tip {
            font-size: 0.9rem;
            opacity: 0.8;
            max-width: 320px;
            line-height: 1.6;
        }
        .map-legend {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(15, 25, 55, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px 16px;
            border: 1px solid rgba(180, 200, 255, 0.3);
            z-index: 20;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 130px;
            pointer-events: none;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }
        .legend-badge {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
        .legend-badge.circle { border-radius: 50%; }
        .legend-text { color: #e5e9f0; font-size: 0.7rem; }
        .lang-switch-btn {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(180, 200, 255, 0.3);
            cursor: pointer;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 500;
            color: #F9D371;
            transition: all 0.2s;
            pointer-events: auto;
        }
        .lang-switch-btn:hover { color: #ffffff; background: rgba(80,100,180,0.4); border-radius: 8px; }
        .filter-tags {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(15, 25, 55, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            z-index: 20;
            border: 1px solid rgba(180, 200, 255, 0.3);
        }
        .tag-btn {
            padding: 6px 16px;
            border-radius: 8px;
            background: rgba(30, 45, 85, 0.7);
            color: #e5e9f0;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .tag-btn:hover, .tag-btn.active {
            background: rgba(80, 100, 180, 0.9);
            color: #ffffff;
            border-color: rgba(200, 220, 255, 0.6);
        }
        .radar-panel {
            flex: 1.2;
            background: rgba(15, 25, 55, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid rgba(180, 200, 255, 0.25);
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }
        .title-section {
            text-align: center;
        }
        .title-section h1 {
            font-size: 1.5rem;
            font-weight: 500;
            background: linear-gradient(135deg, #e5e9f0, #c0c8e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .radar-wrapper {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 10px;
        }
        #radarChart {
            height: 240px;
            width: 100%;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .slider-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            background: rgba(30, 45, 85, 0.7);
            padding: 6px 10px;
            border-radius: 8px;
        }
        .slider-item label {
            width: 100px;
            color: #d0d8e8;
        }
        input[type="range"] {
            flex: 1;
            height: 3px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #8a9fd1, #6a7fc8);
            border-radius: 4px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #e5e9f0;
            border-radius: 50%;
            cursor: pointer;
        }
        .slider-value {
            width: 36px;
            text-align: right;
            font-family: monospace;
            color: #d0d8e8;
        }
        .info-tip {
            background: rgba(15, 25, 55, 0.8);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.75rem;
            border-left: 2px solid #8a9fd1;
        }
        /* 跳转子页：查看全部非遗线路 */
        .starmap-cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(80, 100, 180, 0.9), rgba(120, 80, 200, 0.9));
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 1px;
            border: 1px solid rgba(200, 220, 255, 0.5);
            box-shadow: 0 6px 16px rgba(80, 100, 180, 0.4);
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .starmap-cta:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(110, 130, 210, 1), rgba(150, 100, 220, 1));
            box-shadow: 0 10px 22px rgba(80, 100, 180, 0.6);
            color: #FCE570;
        }
        .starmap-cta .cta-arrow {
            font-size: 1.1rem;
            transition: transform 0.25s ease;
        }
        .starmap-cta:hover .cta-arrow {
            transform: translateX(4px);
        }
        @media (max-width: 1000px) {
            .filter-tags { gap: 6px; padding: 6px 10px; }
            .tag-btn { padding: 4px 10px; font-size: 0.7rem; }
            .slider-item label { width: 85px; font-size: 0.7rem; }
        }

        /* ========== 省份切换器 ========== */
        .province-switcher {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 25, 55, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 8px 16px;
            border: 1px solid rgba(180, 200, 255, 0.4);
            font-size: 0.9rem;
            color: #ffffff;
        }
        .province-switcher .switcher-label {
            color: #c0c8e0;
            font-size: 0.8rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .province-switcher select {
            background: rgba(30, 45, 85, 0.9);
            color: #ffffff;
            border: 1px solid rgba(180, 200, 255, 0.45);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            min-width: 130px;
        }
        .province-switcher select:hover {
            background: rgba(45, 65, 120, 0.95);
            border-color: rgba(200, 220, 255, 0.7);
        }
        .province-switcher select:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        .province-switcher .switcher-status {
            font-size: 0.7rem;
            color: #8a9fd1;
            min-width: 50px;
        }
        .province-switcher .switcher-status.loading {
            color: #F9D371;
        }
        .province-switcher .switcher-status.cached {
            color: #76E4B0;
        }
        @media (max-width: 1000px) {
            .province-switcher {
                top: 70px;
                left: 50%;
                padding: 5px 8px;
                font-size: 0.78rem;
                gap: 6px;
            }
            .province-switcher select {
                padding: 3px 6px;
                font-size: 0.78rem;
                min-width: 90px;
                max-width: 140px;
            }
            .province-switcher .switcher-status {
                font-size: 0.65rem;
            }
            .map-loading .mini-loading-text {
                font-size: 0.85rem;
            }
        }
        @media (max-width: 600px) {
            .province-switcher {
                top: 60px;
                padding: 4px 6px;
                font-size: 0.7rem;
            }
            .province-switcher select {
                font-size: 0.7rem;
                min-width: 78px;
                max-width: 110px;
            }
        }
    </style>
</head>
<body>
    <!-- 公共导航栏（由 static/js/navbar.js 渲染） -->
    <div id="navbarMount"></div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText"></div>
    </div>
    <div class="star-bg"></div>
    <div class="dashboard">
        <div class="map-container">
            <div class="province-switcher" id="provinceSwitcher">
                <span class="switcher-label">🗺️ 省份</span>
                <select id="provinceSelect" aria-label="省份切换"></select>
                <span class="switcher-status" id="switcherStatus">就绪</span>
            </div>
            <div id="mapChart"></div>
            <!-- 地图内层加载动画（覆盖在 mapChart 之上，初始隐藏） -->
            <div id="mapLoading" class="map-loading hide" aria-live="polite">
                <div class="mini-spinner"></div>
                <div class="mini-loading-text" id="mapLoadingText">✨ 星图绘制中 ✨</div>
            </div>
            <!-- 地图内层空状态（数据缺失兜底，初始隐藏） -->
            <div id="mapEmpty" class="map-empty hide" role="status">
                <div class="empty-icon">🌌</div>
                <div class="empty-title">该省份暂无景点数据</div>
                <div class="empty-tip">请尝试切换至其他省份，或稍后再试</div>
            </div>
            <div class="map-legend" id="mapLegend">
                <div class="legend-item"><div class="legend-badge circle" style="background:#FFD966;"></div><span id="legendNaturalText">自然风光</span></div>
                <div class="legend-item"><div class="legend-badge" style="background:#C9B6E0;"></div><span id="legendHistoricText">人文古迹</span></div>
                <div class="legend-item"><div class="legend-badge" style="background:#FFA07A;"></div><span id="legendIntangibleText">非遗体验</span></div>
                <div class="legend-item"><div class="legend-badge" style="background:#76E4B0;"></div><span id="legendFoodText">美食打卡</span></div>
                <div class="legend-item"><div style="width:12px;height:12px;background:#FCE570;border-radius:50%;box-shadow:0 0 4px gold;"></div><span id="legendHighMatchText">高匹配</span></div>
                <div class="lang-switch-btn" id="langSwitchBtn">🌐 中文 / EN</div>
            </div>
            <div class="filter-tags" id="typeFilterGroup">
                <button type="button" class="tag-btn active" data-category="all" id="filterAll">全部星点</button>
                <button type="button" class="tag-btn" data-category="nature" id="filterNatural">自然风光</button>
                <button type="button" class="tag-btn" data-category="historic" id="filterHistoric">人文古迹</button>
                <button type="button" class="tag-btn" data-category="heritage" id="filterIntangible">非遗体验</button>
                <button type="button" class="tag-btn" data-category="food" id="filterFood">美食打卡</button>
            </div>
        </div>
        <div class="radar-panel">
            <div class="title-section">
                <h1 id="mainTitle">徽韵星图 · 文旅雷达</h1>
                <p id="subTitle">调整偏好 · 星辰共鸣 · 灵感流光</p>
            </div>
            <div class="radar-wrapper">
                <div id="radarChart"></div>
            </div>
            <div class="slider-group" id="preferenceSliders">
                <div class="slider-item"><label id="cultureLabel">文化厚重感</label><input type="range" id="cultureSlider" min="0" max="100" value="68"><span id="cultureValue" class="slider-value">68</span></div>
                <div class="slider-item"><label id="sceneryLabel">风景出片率</label><input type="range" id="scenerySlider" min="0" max="100" value="82"><span id="sceneryValue" class="slider-value">82</span></div>
                <div class="slider-item"><label id="foodLabel">美食浓度</label><input type="range" id="foodSlider" min="0" max="100" value="55"><span id="foodValue" class="slider-value">55</span></div>
                <div class="slider-item"><label id="heritageLabel">非遗互动度</label><input type="range" id="heritageSlider" min="0" max="100" value="70"><span id="heritageValue" class="slider-value">70</span></div>
                <div class="slider-item"><label id="leisureLabel">休闲指数</label><input type="range" id="leisureSlider" min="0" max="100" value="80"><span id="leisureValue" class="slider-value">80</span></div>
            </div>
            <div class="info-tip" id="coldInfo">
                <p>✨ 灵感星语：点击任意景点，获取专属冷知识<br>调节雷达滑块，高匹配景点涟漪闪烁，并生成流光旅程~<br>左下角可分类筛选景区。</p>
            </div>
            <a href="travel.html" class="starmap-cta" id="starmapCta" title="查看全部非遗线路列表">
                <i class="fas fa-route"></i>
                <span>查看全部非遗线路</span>
                <span class="cta-arrow">→</span>
            </a>
        </div>
    </div>

    <script src="static/js/starmap-app.js"></script>
    <script src="static/js/navbar.js"></script>
</body>
</html>
