<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>华夏非遗 · 知识图谱</title>
    <!-- 引入 D3.js 核心库 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 引入聊天组件样式（菲菲助手） -->
    <link rel="stylesheet" href="static/css/chat.css">
    <link rel="stylesheet" href="static/css/auth.css">
    <link rel="stylesheet" href="static/css/navbar.css">

    <style>
        html, body {
    min-height: 100%;
    overflow-y: auto;           /* 改为 auto，并隐藏滚动条 */
    scroll-behavior: smooth;
    scrollbar-width: none;      /* Firefox 隐藏滚动条 */
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
    width: 0;
    background: transparent;    /* Chrome/Safari/Edge 隐藏滚动条 */
}
        /* 顶部导航栏：样式见 static/css/navbar.css */
        /* ---------- 全局 & 全屏基本样式 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0f1a 0%, #0c1320 100%);
            font-family: 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
            color: #e8eef2;
            min-height: 100vh;
            padding-top: 80px;      /* 为固定导航栏留出空间 */
            padding-bottom: 20px;   /* 底部留少量空间 */
        }

        /* 顶部导航栏：样式见 static/css/navbar.css */

        /* 图谱主容器 – 扩大展示区域，无标题直接顶上去 */
        .graph-container {
            max-width: none;
            margin: 0 40px;
            background: rgba(10, 15, 26, 0.75);
            backdrop-filter: blur(2px);
            border-radius: 40px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(201, 169, 110, 0.35);
            overflow: hidden;
            position: relative;
            cursor: grab;
            transition: box-shadow 0.3s;
        }
        .graph-container:hover {
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .graph-svg {
            width: 100%;
            height: 86vh;               /* 略微再增高一点，充分利用空间 */
            display: block;
            background: radial-gradient(ellipse at 30% 35%, rgba(60, 80, 120, 0.2) 0%, rgba(0,0,0,0.4) 80%);
        margin-bottom: 47px;}

        @media (max-width: 768px) {
            .graph-svg { height: 76vh; }
        }

        /* 工具提示 – 精致磨砂玻璃风格 */
        .graph-tooltip {
            position: absolute;
            pointer-events: none;
            z-index: 200;
            background: rgba(20, 25, 40, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(201, 169, 110, 0.5);
            border-radius: 20px;
            padding: 14px 18px;
            font-size: 0.8rem;
            color: #f0f0f0;
            max-width: 320px;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.1s;
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
        }
        .graph-tooltip.visible { opacity: 1; }
        .graph-tooltip .tt-title {
            font-weight: bold;
            font-size: 1rem;
            color: #ffd966;
            margin-bottom: 8px;
            border-left: 3px solid #c9a96e;
            padding-left: 10px;
        }
        .graph-tooltip .tt-category {
            display: inline-block;
            font-size: 0.7rem;
            padding: 3px 12px;
            border-radius: 30px;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.5);
        }
        .graph-tooltip table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
        .graph-tooltip th { color: #aaa; font-weight: normal; width: 70px; text-align: left; padding: 5px 6px; }
        .graph-tooltip td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); }

        /* 图例 – 悬浮玻璃效果 */
        .graph-legend {
            position: absolute;
            bottom: 18px;
            left: 18px;
            background: rgba(20, 25, 40, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 10px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 0.7rem;
            border: 1px solid rgba(201, 169, 110, 0.3);
            z-index: 15;
            margin-left: 85px;
        }
        .graph-legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 40px;
            transition: 0.2s;
            background: rgba(0,0,0,0.3);
        }
        .graph-legend-item:hover {
            background: rgba(201, 169, 110, 0.2);
            transform: translateY(-1px);
        }
        .graph-legend-dot { width: 10px; height: 10px; border-radius: 50%; }
        .graph-legend-count { color: #c9b18a; margin-left: 4px; font-size: 0.65rem; }

        /* 重置按钮 */
        .graph-reset-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(201, 169, 110, 0.6);
            color: #ffecb3;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 15;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .graph-reset-btn:hover {
            background: #c9a96e;
            color: #1f1b18;
            border-color: #ffd966;
            transform: scale(1.02);
        }

        /* 加载提示 */
        .loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            padding: 12px 24px;
            border-radius: 60px;
            color: #ffd966;
            font-size: 0.9rem;
            backdrop-filter: blur(8px);
            pointer-events: none;
            z-index: 20;
        }

        /* 响应式微调 */
        @media (max-width: 768px) {
            .graph-legend { bottom: 12px; left: 12px; padding: 6px 12px; gap: 8px; }
            .graph-reset-btn { bottom: 14px; right: 14px; padding: 6px 14px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <!-- 统一顶部导航栏 (与 index.html 完全一致) -->
    <!-- 公共导航栏（由 static/js/navbar.js 渲染） -->
    <div id="navbarMount"></div>

    <!-- 知识图谱主体内容（标题已删除，图谱直接显示） -->
    <div class="graph-container" id="graphContainer">
        <svg class="graph-svg" id="knowledgeGraphSvg"></svg>
        <div class="graph-tooltip" id="graphTooltip"></div>

        </div>

            <i class="fas fa-spinner fa-pulse"></i> 正在加载非遗数据...
        </div>
    </div>

   <!-- AI 聊天窗口（菲菲无头像版） -->
<div id="aiChatWindow" class="ai-chat-window">
    <div class="chat-header">
        <span><i class="fas fa-child" style="color: #ffaa66;"></i> 菲菲 · 非遗小助手</span>
        <span class="close-chat" id="closeChat">&times;</span>
    </div>
    <div class="chat-body" id="chatBody">
        <div class="chat-message ai">
            <div class="message-sender">菲菲</div>
            <div class="message-bubble">您好！我是菲菲，有任何戏曲、演出、非遗的问题都可以问我～</div>
        </div>
    </div>
    <div class="chat-input-area">

    <script>
        // 导航栏激活态由 static/js/navbar.js 统一处理
    </script>

    <!-- 知识图谱核心脚本 -->
    <script>
        (function initKnowledgeGraph() {
            // ----- 颜色配置（10大类别）-----
            const COLORS = {
                '民间文学': '#FF6B6B',
                '传统音乐': '#FF9F43',
                '传统舞蹈': '#FECA57',
                '传统戏剧': '#48DBFB',
                '曲艺': '#FF6FB7',
                '传统体育、游艺与杂技': '#A29BFE',
                '传统美术': '#55E6C1',
                '传统技艺': '#FD79A8',
                '传统医药': '#00CEC9',
                '民俗': '#6C5CE7'
            };
            const ROOT_COLOR = '#f0c060';
            const ROOT_R = 26;
            const CAT_R = 16;
            const ITEM_R = 6;
            const CAT_DIST = 270;
            const MAX_ITEMS_PER_CAT = 160;

            const container = document.getElementById('graphContainer');
            const svg = d3.select('#knowledgeGraphSvg');
            let width = container.clientWidth, height = container.clientHeight || 600;
            svg.attr('width', width).attr('height', height);

            const gRoot = svg.append('g');
            const linkG = gRoot.append('g');
            const nodeG = gRoot.append('g');
            const labelG = gRoot.append('g');

            // 缩放交互，初始缩放调整为 0.85，确保所有类别节点可见
            const zoom = d3.zoom()
                .scaleExtent([0.2, 4])
                .on('zoom', (e) => gRoot.attr('transform', e.transform));
            svg.call(zoom);
            // 初始变换：居中并缩放至 0.85
            svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.85));

            svg.on('dblclick.zoom', function(e) {
                if (e.target === svg.node()) resetView();
            });
            document.getElementById('graphResetBtn').addEventListener('click', resetView);
            function resetView() {
                svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.85));
            }

            let simulation, allNodes, allLinks, visibleIds, rootY;

            function buildGraph(data) {
                const nodes = [], links = [], map = new Map();
                const rootId = '__root__';
                nodes.push({
                    id: rootId,
                    name: '非物质文化遗产',
                    depth: 0,
                    isRoot: true,
                    isCategory: false,
                    isItem: false,
                    color: ROOT_COLOR,
                    radius: ROOT_R
                });
                map.set(rootId, nodes[0]);

                let catCounts = {}, cats = [];
                for (const cat of data.children) {
                    const catName = cat.name;
                    if (!COLORS[catName]) continue;
                    cats.push(catName);
                    const limited = cat.children.slice(0, MAX_ITEMS_PER_CAT);
                    const catId = 'cat::' + catName;
                    const catNode = {
                        id: catId,
                        name: catName,
                        depth: 1,
                        isRoot: false,
                        isCategory: true,
                        isItem: false,
                        color: COLORS[catName],
                        radius: CAT_R,
                        itemCount: limited.length
                    };
                    nodes.push(catNode);
                    map.set(catId, catNode);
                    links.push({ source: rootId, target: catId, depth: 0 });

                    for (const item of limited) {
                        const itemId = 'item::' + catName + '::' + item.name;
                        const itemNode = {
                            id: itemId,
                            name: item.name,
                            depth: 2,
                            isRoot: false,
                            isCategory: false,
                            isItem: true,
                            color: catNode.color,
                            radius: ITEM_R,
                            records: item.records || [],
                            category: catName
                        };
                        nodes.push(itemNode);
                        map.set(itemId, itemNode);
                        links.push({ source: catId, target: itemId, depth: 1 });
                    }
                    catCounts[catName] = limited.length;
                }
                return { nodes, links, map, catCounts, cats };
            }

            function render(gd) {
                allNodes = gd.nodes;
                allLinks = gd.links;
                rootY = 0;
                visibleIds = new Set(allNodes.filter(n => n.isRoot || n.isCategory).map(n => n.id));

                const catNodes = allNodes.filter(n => n.isCategory);
                catNodes.forEach((cat, i) => {
                    const angle = (2 * Math.PI * i) / catNodes.length - Math.PI / 2;
                    cat.initX = Math.cos(angle) * CAT_DIST;
                    cat.initY = rootY + Math.sin(angle) * CAT_DIST;
                });

                function getVisibleNodesAndLinks() {
                    const visNodes = allNodes.filter(n => visibleIds.has(n.id));
                    const visLinks = allLinks.filter(l => visibleIds.has(l.source) && visibleIds.has(l.target));
                    return { visNodes, visLinks };
                }

                function startSimulation() {
                    const { visNodes, visLinks } = getVisibleNodesAndLinks();
                    const simNodes = visNodes.map(n => ({
                        ...n,
                        x: n.initX ?? (Math.random() - 0.5) * 200,
                        y: n.initY ?? (Math.random() - 0.5) * 200,
                        fx: n.isRoot ? 0 : undefined,
                        fy: n.isRoot ? rootY : undefined
                    }));
                    const simLinks = visLinks.map(l => ({ ...l }));

                    if (simulation) simulation.stop();
                    simulation = d3.forceSimulation(simNodes)
                        .force('link', d3.forceLink(simLinks)
                            .id(d => d.id)
                            .distance(l => l.depth === 0 ? 130 : 85)
                            .strength(l => l.depth === 0 ? 0.28 : 0.15))
                        .force('charge', d3.forceManyBody()
                            .strength(d => d.isRoot ? -1800 : (d.isCategory ? -800 : -200)))
                        .force('center', d3.forceCenter(0, rootY).strength(0.1))
                        .force('collision', d3.forceCollide().radius(d => d.radius + 6))
                        .force('radial', d3.forceRadial(d => d.isCategory ? CAT_DIST : 0, 0, rootY)
                            .strength(d => d.isCategory ? 0.65 : 0))
                        .alpha(0.8).alphaDecay(0.022);

                    const link = linkG.selectAll('line').data(simLinks, d => d.source.id + '--' + d.target.id);
                    link.join('line')
                        .attr('stroke', 'rgba(210, 190, 140, 0.5)')
                        .attr('stroke-width', l => l.depth === 0 ? 2.5 : 1.2)
                        .attr('stroke-opacity', 0.6)
                        .attr('stroke-dasharray', l => l.depth === 0 ? 'none' : '2 2');

                    const nodeSel = nodeG.selectAll('g.node').data(simNodes, d => d.id);
                    const nodeEnter = nodeSel.join('g')
                        .attr('class', 'node')
                        .style('cursor', d => d.isCategory ? 'pointer' : (d.isItem ? 'crosshair' : 'default'));

                    nodeEnter.selectAll('circle').remove();
                    nodeEnter.append('circle')
                        .attr('r', d => d.radius)
                        .attr('fill', d => d.color)
                        .attr('stroke', '#fff')
                        .attr('stroke-width', d => d.isRoot ? 3 : (d.isCategory ? 2 : 0.8))
                        .attr('stroke-opacity', 0.85);

                    if (simNodes.some(d => d.isRoot)) {
                        nodeEnter.filter(d => d.isRoot)
                            .append('circle')
                            .attr('r', ROOT_R + 10)
                            .attr('fill', 'none')
                            .attr('stroke', ROOT_COLOR)
                            .attr('stroke-width', 2)
                            .attr('stroke-opacity', 0.4);
                    }

                    const labelData = simNodes.filter(d => d.isRoot || d.isCategory || d.isItem);
                    const textSel = labelG.selectAll('text').data(labelData, d => d.id);
                    textSel.join('text')
                        .attr('text-anchor', 'middle')
                        .attr('dy', d => {
                            if (d.isRoot) return -ROOT_R - 20;
                            if (d.isCategory) return -CAT_R - 12;
                            return -ITEM_R - 8;
                        })
                        .attr('font-size', d => d.isRoot ? '16px' : (d.isCategory ? '13px' : '9.5px'))
                        .attr('font-weight', d => (d.isRoot || d.isCategory) ? 'bold' : 'normal')
                        .attr('fill', '#f5f0e6')
                        .style('text-shadow', '0 1px 3px rgba(0,0,0,0.7)')
                        .text(d => d.name.length > 22 ? d.name.slice(0, 20) + '…' : d.name);

                    nodeEnter.on('click', (e, d) => {
                        if (d.isCategory) {
                            e.stopPropagation();
                            toggleCategory(d);
                        }
                    })
                    .on('mouseenter', function(e, d) {
                        if (d.isItem && d.records && d.records.length > 0) {
                            showTooltip(e, d);
                            d3.select(this).select('circle').transition().duration(150).attr('r', d.radius * 2.2);
                        }
                    })
                    .on('mouseleave', function(e, d) {
                        if (d.isItem) {
                            hideTooltip();
                            d3.select(this).select('circle').transition().duration(150).attr('r', d.radius);
                        }
                    });

                    simulation.on('tick', () => {
                        linkG.selectAll('line')
                            .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
                            .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
                        nodeG.selectAll('g.node').attr('transform', d => `translate(${d.x},${d.y})`);
                        labelG.selectAll('text').attr('x', d => d.x).attr('y', d => d.y);
                    });
                    simulation._simNodes = simNodes;
                }

                function toggleCategory(catNode) {
                    const children = allNodes.filter(n => n.isItem && n.category === catNode.name).map(n => n.id);
                    const expanded = children.some(id => visibleIds.has(id));
                    if (expanded) children.forEach(id => visibleIds.delete(id));
                    else children.forEach(id => visibleIds.add(id));
                    startSimulation();
                    document.querySelectorAll('.graph-legend-item').forEach(el => {
                        const cat = el.querySelector('span:nth-child(2)').innerText;
                        const has = allNodes.some(n => n.isItem && n.category === cat && visibleIds.has(n.id));
                        if (has) el.style.background = 'rgba(201,169,110,0.25)';
                        else el.style.background = '';
                    });
                }

                function showTooltip(ev, d) {
                    if (!d.records || d.records.length === 0) return;
                    const tooltipDiv = document.getElementById('graphTooltip');
                    let html = `<div class="tt-title">${escapeHtml(d.name)}</div>
                                <span class="tt-category" style="background:${d.color}">${escapeHtml(d.category)}</span>`;
                    d.records.forEach(r => {
                        html += `<table>`;
                        if (r['公布时间']) html += `<tr><th>公布时间</th><td>${escapeHtml(r['公布时间'])}</td></tr>`;
                        if (r['申报地区或单位']) html += `<tr><th>申报地区</th><td>${escapeHtml(r['申报地区或单位'])}</td></tr>`;
                        if (r['保护单位']) html += `<tr><th>保护单位</th><td>${escapeHtml(r['保护单位'])}</td></tr>`;
                        html += `</table>`;
                    });
                    tooltipDiv.innerHTML = html;
                    tooltipDiv.classList.add('visible');

                    const rect = container.getBoundingClientRect();
                    let left = ev.clientX - rect.left + 18;
                    let top = ev.clientY - rect.top - 20;
                    const ttRect = tooltipDiv.getBoundingClientRect();
                    if (left + ttRect.width > rect.width - 10) left = ev.clientX - rect.left - ttRect.width - 18;
                    if (top + ttRect.height > rect.height - 10) top = ev.clientY - rect.top - ttRect.height - 18;
                    tooltipDiv.style.left = Math.max(8, left) + 'px';
                    tooltipDiv.style.top = Math.max(8, top) + 'px';
                }

                function hideTooltip() {
                    document.getElementById('graphTooltip').classList.remove('visible');
                }

                const legendDiv = document.getElementById('graphLegend');
                legendDiv.innerHTML = '';
                for (let cat of gd.cats) {
                    const item = document.createElement('div');
                    item.className = 'graph-legend-item';
                    item.innerHTML = `<span class="graph-legend-dot" style="background:${COLORS[cat]}"></span>
                                      <span>${cat}</span>
                                      <span class="graph-legend-count">(${gd.catCounts[cat] || 0})</span>`;
                    item.addEventListener('click', () => {
                        const catNode = allNodes.find(n => n.isCategory && n.name === cat);
                        if (catNode) toggleCategory(catNode);
                    });
                    legendDiv.appendChild(item);
                }
                startSimulation();
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            const loadingMsg = document.getElementById('loadingMsg');
            fetch('static/data/intangible_heritage_data.json')
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    const graphData = buildGraph(data);
                    render(graphData);
                    if (loadingMsg) loadingMsg.style.display = 'none';
                })
                .catch(err => {
                    console.error('非遗数据加载失败:', err);
                    if (loadingMsg) loadingMsg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> 数据加载失败，请检查文件路径或网络';
                    svg.append('text')
                        .attr('x', '50%')
                        .attr('y', '45%')
                        .attr('text-anchor', 'middle')
                        .attr('fill', '#ff8a6f')
                        .style('font-size', '1.2rem')
                        .text('❌ 非遗数据加载失败，请确保 intangible_heritage_data.json 存在');
                });
        })();
    </script>

    <script src="static/js/chat.js"></script>
